name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  version-bump:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        id: version
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Update changelog
        run: npx conventional-changelog -p angular

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          # PRs opened with GITHUB_TOKEN do not trigger other workflows; set RELEASE_TOKEN so Test runs on the release PR.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          branch: release/version-bump
          commit-message: "chore(release): v${{ steps.version.outputs.version }}"
          title: "chore(release): v${{ steps.version.outputs.version }}"
          body: |
            Version bump: `${{ inputs.bump }}` → `v${{ steps.version.outputs.version }}`

            Review the version and `CHANGELOG.md` before merging. After merge the **Publish** workflow runs checks, publishes to npm, pushes the `v${{ steps.version.outputs.version }}` tag, moves the major tag, and creates the GitHub Release.
