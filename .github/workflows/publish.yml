name: Publish

on:
  push:
    branches:
      - master
    paths:
      - package.json

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for unreleased version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # The GitHub Release is the last publish step, so its absence means the version is not fully released.
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION")

          case "$STATUS" in
            200) echo "release=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "release=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Unexpected HTTP $STATUS while checking release v$VERSION"; exit 1 ;;
          esac

  publish:
    runs-on: ubuntu-24.04
    needs: check
    if: needs.check.outputs.release == 'true'
    environment: npm

    permissions:
      contents: write
      id-token: write

    env:
      VERSION: ${{ needs.check.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build package
        run: npm run build

      - name: Check generated package exports are committed
        run: git diff --exit-code package.json

      - name: Extract release notes
        run: |
          # Angular preset headings: "# [x.y.0](...)" for minor/major, "## [x.y.z](...)" for patch.
          awk -v version="$VERSION" '
            /^##? \[?[0-9]+\.[0-9]+\.[0-9]+/ {
              if (found) exit
              if (index($0, "[" version "]") || index($0, " " version " ")) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "::error::No CHANGELOG.md section found for $VERSION"
            exit 1
          fi

      - name: Publish to npm via Trusted Publisher
        run: |
          NAME=$(node -p "require('./package.json').name")

          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already published"
          else
            npm publish
          fi

      - name: Push tags
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null
          STATUS=$?
          set -e

          case "$STATUS" in
            0)
              echo "Tag v$VERSION already exists"
              git fetch --no-tags origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
              ;;
            2)
              git tag "v$VERSION"
              git push origin "v$VERSION"
              ;;
            *)
              echo "::error::git ls-remote failed with exit code $STATUS"
              exit 1
              ;;
          esac

          git tag -f "v${VERSION%%.*}" "v$VERSION^{commit}"
          git push -f origin "v${VERSION%%.*}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
